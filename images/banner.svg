<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">LabFabric free EVE-NG and PNETLab labs</title>
  <desc id="d">Ten free CCNA and CCNP troubleshooting labs as .unl files, with a small animated network topology.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="95%" cy="100%" r="40%">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <g id="router">
      <circle r="17" fill="#0a0d16" stroke="#60a5fa" stroke-width="2"/>
      <path d="M-7 -3h14M3 -7l4 4-4 4M7 3h-14M-3 -1l-4 4 4 4" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="switch">
      <rect x="-19" y="-13" width="38" height="26" rx="5" fill="#0a0d16" stroke="#60a5fa" stroke-width="2"/>
      <path d="M-9 -4h16l-3-3M9 4h-16l3 3" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="host">
      <rect x="-15" y="-12" width="30" height="20" rx="3" fill="#0a0d16" stroke="#60a5fa" stroke-width="2"/>
      <path d="M-6 13h12M0 8v5" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    </g>
    <style>
      .ink { fill: #e6edf7; font-family: "Inter Tight", Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
      .muted { fill: #93a1b8; font-family: "Inter Tight", Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { fill: #7dd3fc; font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; }
      .link { stroke: #3b82f6; stroke-opacity: 0.55; stroke-width: 2; }
      .caret { animation: blink 1.1s steps(1, end) infinite; }
      .pkt { fill: #22d3ee; opacity: 0; animation-fill-mode: both; }
      .p1 { animation: a1 4.8s cubic-bezier(.45,0,.55,1) infinite; }
      .p2 { animation: a2 4.8s cubic-bezier(.45,0,.55,1) infinite 2.4s; }
      .p3 { animation: a3 6s linear infinite 1.2s; }
      @keyframes blink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }
      /* R1 (880,160) -> R2 (1030,160) -> SW1 (1150,105) */
      @keyframes a1 { 0% { transform: translate(880px,160px); opacity: 0 } 6% { opacity: 1 } 45% { transform: translate(1030px,160px) } 55% { transform: translate(1030px,160px); opacity: 1 } 90% { transform: translate(1150px,105px); opacity: 1 } 100% { transform: translate(1150px,105px); opacity: 0 } }
      @keyframes a2 { 0% { transform: translate(1150px,215px); opacity: 0 } 6% { opacity: 1 } 45% { transform: translate(1030px,160px) } 55% { transform: translate(1030px,160px); opacity: 1 } 90% { transform: translate(880px,160px); opacity: 1 } 100% { transform: translate(880px,160px); opacity: 0 } }
      @keyframes a3 { 0% { transform: translate(800px,250px); opacity: 0 } 8% { opacity: 0.9 } 92% { opacity: 0.9 } 100% { transform: translate(880px,160px); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        .caret, .p1, .p2, .p3 { animation: none; }
        .pkt { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1280" height="320" fill="#0a0d16"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>

  <!-- LabFabric lockup: terminal mark, wordmark split by weight, prompt caret -->
  <g transform="translate(64 52)">
    <rect width="184" height="48" rx="8" fill="#0f1524" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(14 12)" stroke="#60a5fa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="3 18 10 11 3 4"/>
      <line x1="13" y1="18" x2="22" y2="18"/>
    </g>
    <text x="48" y="32" class="ink" font-size="22"><tspan font-weight="400">Lab</tspan><tspan font-weight="700">Fabric</tspan></text>
    <rect class="caret" x="160" y="14" width="10" height="20" rx="1.5" fill="#60a5fa"/>
  </g>

  <text x="64" y="176" class="ink" font-size="46" font-weight="700" letter-spacing="-1">Free EVE-NG and PNETLab labs</text>
  <text x="64" y="218" class="muted" font-size="22">Ten broken networks to fix, as ready-to-import .unl files.</text>
  <text x="64" y="268" class="mono" font-size="15">CCNA · CCNP · OSPF · EIGRP · BGP · STP · VLAN · GRE · CC BY 4.0</text>

  <!-- Topology -->
  <g>
    <line class="link" x1="800" y1="250" x2="880" y2="160"/>
    <line class="link" x1="880" y1="160" x2="1030" y2="160"/>
    <line class="link" x1="1030" y1="160" x2="1150" y2="105"/>
    <line class="link" x1="1030" y1="160" x2="1150" y2="215"/>
    <line class="link" x1="1150" y1="105" x2="1226" y2="52"/>
    <line class="link" x1="1150" y1="215" x2="1226" y2="268"/>
    <line class="link" x1="1150" y1="105" x2="1150" y2="215" stroke-dasharray="5 6"/>

    <circle class="pkt p1" r="4.5"/>
    <circle class="pkt p2" r="4.5"/>
    <circle class="pkt p3" r="3.5"/>

    <use href="#host" x="800" y="250"/>
    <use href="#router" x="880" y="160"/>
    <use href="#router" x="1030" y="160"/>
    <use href="#switch" x="1150" y="105"/>
    <use href="#switch" x="1150" y="215"/>
    <use href="#host" x="1226" y="52"/>
    <use href="#host" x="1226" y="268"/>

    <g class="mono" font-size="12" fill-opacity="0.75">
      <text x="880" y="198" text-anchor="middle">R1</text>
      <text x="1030" y="198" text-anchor="middle">R2</text>
      <text x="1150" y="77" text-anchor="middle">SW1</text>
      <text x="1150" y="247" text-anchor="middle">SW2</text>
    </g>
  </g>
</svg>
